services:
  - type: web
    name: birthday-backend
    runtime: python
    pythonVersion: 3.12
    plan: free
    buildCommand: bash build.sh
    # Must bind 0.0.0.0:$PORT - Render routes traffic to the $PORT env var.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    # "/" is not a reliable probe: it serves an optional static page that may
    # not exist in the deployed repo layout. /api/health always returns 200.
    healthCheckPath: /api/health
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: PAYHERO_BASE_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_USERNAME
        sync: false
      - key: PAYHERO_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUBMISSION_START_ISO
        value: "2026-10-01T00:00:00+03:00"
      - key: SUBMISSION_CUTOFF_ISO
        value: "2026-10-03T00:00:00+03:00"
      - key: ADMIN_TOKEN
        sync: false
